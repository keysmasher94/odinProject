<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc">
  <title id="title">Slice of pepperoni pizza</title>
  <desc id="desc">A cartoon-style triangular slice of cheese pizza with a golden crust and pepperoni slices.</desc>
  <defs>
    <linearGradient id="cheese" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe88a"/>
      <stop offset="1" stop-color="#f6b93b"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8c56b"/>
      <stop offset="1" stop-color="#c87932"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#5a3218" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Crust -->
  <path d="M88 133 Q300 42 512 133 L529 164 Q300 78 71 164 Z"
        fill="url(#crust)" stroke="#9c5427" stroke-width="8" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M105 139 Q300 64 495 139" fill="none" stroke="#ffe0a0" stroke-width="9" stroke-linecap="round" opacity=".8"/>

  <!-- Pizza slice -->
  <path d="M71 158 Q300 73 529 158 L310 466 Q300 481 290 466 Z"
        fill="url(#cheese)" stroke="#b96a2c" stroke-width="9" stroke-linejoin="round"/>

  <!-- Melted cheese highlights -->
  <path d="M112 171 Q170 145 220 145" fill="none" stroke="#fff0b3" stroke-width="12" stroke-linecap="round" opacity=".8"/>
  <path d="M478 176 Q435 159 399 157" fill="none" stroke="#fff0b3" stroke-width="9" stroke-linecap="round" opacity=".65"/>
  <path d="M285 449 Q300 466 313 447" fill="none" stroke="#e99a36" stroke-width="7" stroke-linecap="round" opacity=".7"/>

  <!-- Pepperoni -->
  <g stroke="#a92e20" stroke-width="6">
    <circle cx="185" cy="190" r="31" fill="#d94b32"/>
    <circle cx="305" cy="170" r="33" fill="#cf3d2b"/>
    <circle cx="423" cy="194" r="30" fill="#d94b32"/>
    <circle cx="250" cy="278" r="34" fill="#d94b32"/>
    <circle cx="375" cy="292" r="32" fill="#cf3d2b"/>
    <circle cx="310" cy="390" r="29" fill="#d94b32"/>
  </g>
  <g fill="#f58a5b" opacity=".85">
    <circle cx="175" cy="181" r="5"/><circle cx="197" cy="201" r="4"/><circle cx="191" cy="178" r="3"/>
    <circle cx="294" cy="158" r="5"/><circle cx="318" cy="180" r="4"/><circle cx="319" cy="155" r="3"/>
    <circle cx="414" cy="185" r="5"/><circle cx="434" cy="202" r="4"/><circle cx="432" cy="180" r="3"/>
    <circle cx="239" cy="267" r="5"/><circle cx="263" cy="289" r="4"/><circle cx="263" cy="267" r="3"/>
    <circle cx="365" cy="281" r="5"/><circle cx="386" cy="302" r="4"/><circle cx="388" cy="281" r="3"/>
    <circle cx="301" cy="380" r="5"/><circle cx="319" cy="400" r="4"/>
  </g>

  <!-- Small browned cheese bubbles -->
  <g fill="#e99a36" opacity=".8">
    <circle cx="135" cy="232" r="5"/><circle cx="335" cy="230" r="4"/><circle cx="455" cy="247" r="5"/>
    <circle cx="194" cy="337" r="4"/><circle cx="420" cy="354" r="5"/><circle cx="265" cy="430" r="4"/>
  </g>
</svg>
